version: '3.1'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_USER: odoo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:18.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - DB_PORT=5432
    volumes:
      # Monta TODOS los addons (community + enterprise + personalizados)
      - ./addons:/mnt/extra-addons
      # Monta el código fuente de Odoo para desarrollo
      - ./odoo:/mnt/odoo-src
      # Datos persistentes de Odoo
      - odoo-data:/var/lib/odoo
      # Archivo de configuración personalizado
      - ./config:/etc/odoo
    command: >
      odoo 
      --config=/etc/odoo/odoo.conf
      --dev=reload,qweb,werkzeug,xml

volumes:
  pgdata:
  odoo-data:
