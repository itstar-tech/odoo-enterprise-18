[options]
# Configuración de base de datos
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = odoo

# Rutas de addons - Odoo buscará módulos en estos directorios
# El orden importa: Los addons personalizados tienen prioridad sobre los del contenedor
# /usr/lib/python3/dist-packages/odoo/addons = Addons base de Odoo (en el contenedor)
# /mnt/extra-addons = Todos tus addons (community + enterprise + personalizados)
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

# Configuración del servidor
http_port = 8069
workers = 0

# Modo desarrollo (recarga automática de código)
dev_mode = reload,qweb,werkzeug,xml

# Límites
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = -1

# Logs
log_level = info
log_handler = :INFO

# Seguridad (CAMBIA EN PRODUCCIÓN)
admin_passwd = admin

# Idioma y localización
without_demo = False
