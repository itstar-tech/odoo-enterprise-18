[options]
# Database configuration
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = False
list_db = True
dbfilter = .*

# Addons path
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

# Server configuration
http_port = 8069
workers = 0

# Development mode
dev_mode = reload,qweb,werkzeug,xml

# Memory limits
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = -1

# Logging
log_level = info
log_handler = :INFO

# Security
admin_passwd = admin

# Demo data
without_demo = False
